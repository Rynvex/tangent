services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: tangent-postgres
    environment:
      POSTGRES_USER: tangent
      POSTGRES_PASSWORD: tangent
      POSTGRES_DB: tangent
    ports:
      - "127.0.0.1:5444:5432"
    volumes:
      - tangent-pgdata:/var/lib/postgresql/data
      - ./scripts/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tangent -d tangent"]
      interval: 2s
      timeout: 3s
      retries: 20
    restart: unless-stopped

volumes:
  tangent-pgdata:
